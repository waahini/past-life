<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전생 신분증 발급처 - 괴짜 공무원 사무소</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📜 전생 신분증 발급처</h1>
            <p class="subtitle">당신의 보잘것없던 전생을 굳이 증명해 드립니다.</p>
        </header>

        <main>
            <div class="input-section">
                <input type="text" id="userName" placeholder="성함을 입력하세요..." maxlength="10">
                <button id="issueBtn">신분증 발급받기</button>
            </div>

            <!-- 로딩 화면 -->
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>전생 명부를 탈탈 터는 중...</p>
            </div>

            <!-- 결과 카드 -->
            <div id="resultCard" class="id-card hidden">
                <div class="card-header">
                    <span class="official-seal">전생증명</span>
                    <h2>전생 신분증</h2>
                </div>
                <div class="card-body">
                    <div class="photo-area">
                        <span id="resultEmoji">❓</span>
                    </div>
                    <div class="info-area">
                        <div class="info-group">
                            <label>성명</label>
                            <span id="resName">-</span>
                        </div>
                        <div class="info-group">
                            <label>시대</label>
                            <span id="resEra">-</span>
                        </div>
                        <div class="info-group">
                            <label>직업</label>
                            <span id="resJob">-</span>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="story-box">
                        <p id="resStory">-</p>
                    </div>
                    <div class="crime-box">
                        <strong>죄목/특이사항:</strong> <span id="resCrime">-</span>
                    </div>
                    <p class="notice">본 신분증은 현생에서 아무런 쓸모가 없습니다.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
